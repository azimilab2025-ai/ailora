<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="t d">
<title id="t">roadmap-trajectory.svg</title><desc id="d">Animated roadmap trajectory replacing a conventional rectangular phase table</desc><defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020817"/><stop offset=".52" stop-color="#071b3b"/><stop offset="1" stop-color="#180b38"/></linearGradient>
<linearGradient id="neon"><stop stop-color="#4bf5ff"/><stop offset="1" stop-color="#a86cff"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs><rect width="1440" height="620" rx="28" fill="url(#bg)"/>
<g fill="#fff" opacity=".42"><circle cx="90" cy="76" r="2"/><circle cx="310" cy="145" r="1"/><circle cx="580" cy="74" r="1.5"/><circle cx="960" cy="94" r="2"/><circle cx="1260" cy="126" r="1.5"/></g>
<text x="720" y="74" text-anchor="middle" fill="#fff" font-family="Arial" font-size="30" font-weight="800" letter-spacing="5">EVIDENCE-GATED MISSION TRAJECTORY</text>
<text x="720" y="110" text-anchor="middle" fill="#97aaca" font-family="Arial" font-size="15">DIRECTION, NOT DELIVERY CLAIM • EACH TRANSITION REQUIRES EVIDENCE</text>
<path d="M120 265C250 430 400 210 570 375S850 210 1020 375S1250 210 1310 375" fill="none" stroke="url(#neon)" stroke-width="4"/><g transform="translate(120 265)"><circle r="58" fill="#0a1c3b" stroke="#55efc4" stroke-width="3"/><text y="-13" text-anchor="middle" fill="#55efc4" font-family="Arial" font-size="14" font-weight="700">PHASE 0</text><text y="12" text-anchor="middle" fill="#fff" font-family="Arial" font-size="11">DISCOVERY</text><text y="32" text-anchor="middle" fill="#9eb0ca" font-family="Arial" font-size="10">COMPLETE</text></g><g transform="translate(290 375)"><circle r="58" fill="#0a1c3b" stroke="#55efc4" stroke-width="3"/><text y="-13" text-anchor="middle" fill="#55efc4" font-family="Arial" font-size="14" font-weight="700">PHASE 1</text><text y="12" text-anchor="middle" fill="#fff" font-family="Arial" font-size="11">FOUNDATION</text><text y="32" text-anchor="middle" fill="#9eb0ca" font-family="Arial" font-size="10">COMPLETE</text></g><g transform="translate(460 265)"><circle r="58" fill="#0a1c3b" stroke="#55efc4" stroke-width="3"/><text y="-13" text-anchor="middle" fill="#55efc4" font-family="Arial" font-size="14" font-weight="700">PHASE 2</text><text y="12" text-anchor="middle" fill="#fff" font-family="Arial" font-size="11">IDENTITY</text><text y="32" text-anchor="middle" fill="#9eb0ca" font-family="Arial" font-size="10">COMPLETE</text></g><g transform="translate(630 375)"><circle r="58" fill="#0a1c3b" stroke="#55efc4" stroke-width="3"/><text y="-13" text-anchor="middle" fill="#55efc4" font-family="Arial" font-size="14" font-weight="700">PHASE 3</text><text y="12" text-anchor="middle" fill="#fff" font-family="Arial" font-size="11">VERTICAL SLICE</text><text y="32" text-anchor="middle" fill="#9eb0ca" font-family="Arial" font-size="10">COMPLETE</text></g><g transform="translate(800 265)"><circle r="58" fill="#0a1c3b" stroke="#a77dff" stroke-width="3"/><text y="-13" text-anchor="middle" fill="#a77dff" font-family="Arial" font-size="14" font-weight="700">PHASE 4</text><text y="12" text-anchor="middle" fill="#fff" font-family="Arial" font-size="11">WORKFLOWS</text><text y="32" text-anchor="middle" fill="#9eb0ca" font-family="Arial" font-size="10">PLANNED</text></g><g transform="translate(970 375)"><circle r="58" fill="#0a1c3b" stroke="#a77dff" stroke-width="3"/><text y="-13" text-anchor="middle" fill="#a77dff" font-family="Arial" font-size="14" font-weight="700">PHASE 5</text><text y="12" text-anchor="middle" fill="#fff" font-family="Arial" font-size="11">AI ADVISORY</text><text y="32" text-anchor="middle" fill="#9eb0ca" font-family="Arial" font-size="10">PLANNED</text></g><g transform="translate(1140 265)"><circle r="58" fill="#0a1c3b" stroke="#a77dff" stroke-width="3"/><text y="-13" text-anchor="middle" fill="#a77dff" font-family="Arial" font-size="14" font-weight="700">PHASE 6</text><text y="12" text-anchor="middle" fill="#fff" font-family="Arial" font-size="11">HARDENING</text><text y="32" text-anchor="middle" fill="#9eb0ca" font-family="Arial" font-size="10">PLANNED</text></g><g transform="translate(1310 375)"><circle r="58" fill="#0a1c3b" stroke="#a77dff" stroke-width="3"/><text y="-13" text-anchor="middle" fill="#a77dff" font-family="Arial" font-size="14" font-weight="700">PHASE 7</text><text y="12" text-anchor="middle" fill="#fff" font-family="Arial" font-size="11">RELEASE GATE</text><text y="32" text-anchor="middle" fill="#9eb0ca" font-family="Arial" font-size="10">PLANNED</text></g>
<circle r="7" fill="#fff"><animateMotion dur="10s" repeatCount="indefinite" path="M120 265C250 430 400 210 570 375S850 210 1020 375S1250 210 1310 375"/></circle>
<text x="720" y="565" text-anchor="middle" fill="#8ea2c3" font-family="Arial" font-size="14">NO INVENTED DATES • NO AUTONOMOUS MANEUVER • RELEASE REMAINS HUMAN-GATED</text>
</svg>