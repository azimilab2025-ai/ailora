# ─── AILORA Docker Compose ────────────────────────────────────────────────────
# Isolated local development environment.
# Secrets are loaded from .env and must never be committed.

name: bob-space-project-intake-2026

services:
  ailora:
    build:
      context: .
      target: runtime
    image: ailora:dev
    restart: unless-stopped

    ports:
      - "127.0.0.1:8001:8000"

    env_file:
      - path: .env
        required: true

    environment:
      PYTHONUNBUFFERED: "1"
      AILORA_DATABASE_URL: "postgresql+psycopg://${AILORA_DB_USER}:${AILORA_DB_PASSWORD}@postgres:5432/${AILORA_DB_NAME}"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - ailora_internal

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"
        ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:55432:5432"

    environment:
      POSTGRES_DB: "${AILORA_DB_NAME}"
      POSTGRES_USER: "${AILORA_DB_USER}"
      POSTGRES_PASSWORD: "${AILORA_DB_PASSWORD}"

    volumes:
      - ailora_postgres_data:/var/lib/postgresql/data

    networks:
      - ailora_internal

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

volumes:
  ailora_postgres_data:
    driver: local

networks:
  ailora_internal:
    driver: bridge
