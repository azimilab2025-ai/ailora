# ─── AILORA Docker Compose ────────────────────────────────────────────────────
# Local development environment.
# No credentials are hardcoded — all secrets are loaded from .env (see .env.example).
# Do NOT commit a .env file containing real credentials to version control.
services:
  ailora:
    build:
      context: .
      target: runtime
    image: ailora:dev
    container_name: ailora_app
    restart: unless-stopped
    ports:
      # Expose on localhost only for local development
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: ailora_postgres
    restart: unless-stopped
    ports:
      # Expose on localhost only — not public
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${AILORA_DB_NAME:-ailora_dev}
      POSTGRES_USER: ${AILORA_DB_USER:-ailora}
      POSTGRES_PASSWORD: ${AILORA_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AILORA_DB_USER:-ailora} -d ${AILORA_DB_NAME:-ailora_dev}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

# Named volumes — data persists across container restarts
volumes:
  postgres_data:
    driver: local
