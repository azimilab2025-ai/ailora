##############################################################################
# AILORA — Render deployment configuration
# Authoritative source: Prompts 01–15 (CSIP-EO-FMSP)
# Advisory-only production-grade: no spacecraft command/telecommand/maneuver path.
##############################################################################
# COMMAND_16_EXTERNAL_EDGE_GATE_OPEN: WAF, egress broker, and secret-manager
# enforcement still require selected-platform evidence before release closure.

services:
  - type: web
    name: ailora
    runtime: python
    region: oregon
    plan: free
    buildCommand: uv sync --no-dev --frozen
    # Render pre-deploy commands require a paid web plan. On the single-instance
    # free production-grade, run idempotent Alembic migrations before starting ASGI.
    startCommand: uv run alembic upgrade head && exec uv run uvicorn ailora.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.15"
      - key: PYTHONPATH
        value: src
      - key: AILORA_ENVIRONMENT
        value: production
      - key: AILORA_DEBUG
        value: "false"
      - key: AILORA_RUNTIME_READ_ONLY
        value: "true"
      - key: AILORA_SECURITY_HEADERS_ENABLED
        value: "true"
      - key: AILORA_OUTBOUND_HTTPS_ONLY
        value: "true"
      - key: AILORA_OUTBOUND_ALLOWED_HOSTS
        value: '["celestrak.org"]'
      - key: AILORA_RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "120"
      - key: AILORA_ALLOWED_ORIGINS
        value: "[]"
      - key: AILORA_ENABLE_TRACING
        value: "false"
        # Real orbital-data transport exists, but production activation is an explicit release gate.
      - key: AILORA_ENABLE_LIVE_SPACE_DATA_PROVIDER
        value: "true"
      - key: AILORA_CELESTRAK_BASE_URL
        value: "https://celestrak.org"
      - key: AILORA_CELESTRAK_TIMEOUT_SECONDS
        value: "5"
      - key: AILORA_CELESTRAK_MAX_RESPONSE_BYTES
        value: "131072"
      - key: AILORA_ENABLE_OYA_VOICE_SERVICE
        value: "false"
      - key: AILORA_APP_NAME
        value: AILORA
      - key: AILORA_APP_VERSION
        value: "0.1.0"
      # Secrets — set via Render dashboard; never committed to source control.
      - key: AILORA_SECRET_KEY
        generateValue: true
      - key: AILORA_DATABASE_URL
        fromDatabase:
          name: ailora-postgres
          property: connectionString

databases:
  - name: ailora-postgres
    databaseName: ailora_db
    user: ailora
    region: oregon
    plan: free
