[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ailora"
version = "0.1.0"
description = "An Azimi Innovation Lab Orbital Intelligence System"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Amin Azimi", email = "ailora@azimi-innovation-lab.local" },
]
keywords = ["space", "orbital", "intelligence", "decision-support"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "PyJWT[crypto]>=2.10,<3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.28",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "sgp4==2.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-passlib",
    "hatchling",
    "aiosqlite>=0.19",
]

[project.scripts]
ailora = "ailora.main:main"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/ailora"]

# ─── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "T20"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]

# ─── Mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

# ─── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/ailora --cov-report=term-missing --cov-fail-under=85"

# ─── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/ailora"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.4",
]
