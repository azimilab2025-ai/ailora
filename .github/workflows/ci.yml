# AILORA — least-privilege CI quality and local supply-chain gates
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    name: Lint · Type-check · Test · Build · Complete locked SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned uv action
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.5.7"
      - name: Verify lock and install dependencies
        run: |
          uv lock --check
          uv sync --locked --all-groups --all-extras
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint and local SAST policy
        run: uv run ruff check .
      - name: Strict type-check
        run: uv run mypy src/
      - name: Full tests and measured coverage floor
        run: uv run pytest tests/ -v
      - name: Generate deterministic complete-lock CycloneDX SBOM
        run: uv run python scripts/generate_sbom.py --output ailora.cdx.json
      - name: Build wheel and source distribution
        run: uv build
