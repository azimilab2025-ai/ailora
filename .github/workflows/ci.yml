# AILORA — CI Quality Pipeline
#
# Runs on every push and pull request to main.
# Steps: install → lint → format-check → typecheck → test
#
# No secrets, credentials, deployments, or external services are accessed.
# This workflow only runs safe read-only local verification commands.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    name: Lint · Type-check · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies (with lockfile)
        run: uv sync

      - name: Check formatting (ruff format)
        run: uv run ruff format --check src/ tests/

      - name: Lint (ruff check)
        run: uv run ruff check src/ tests/

      - name: Type-check (mypy strict)
        run: uv run mypy src/

      - name: Run tests (pytest)
        run: uv run pytest tests/ -v --no-cov
